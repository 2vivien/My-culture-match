# ─────────────────────────────────────────────────────────────
# Prometheus — configuration My Culture Match (MP18)
# Usage : docker compose -f docker-compose.observability.yml up -d
# Le backend expose /metrics sur le port 3000.
# ─────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'mcm-backend'
    metrics_path: /metrics
    # Token optionnel via METRICS_TOKEN (obligatoire en production)
    authorization:
      credentials: ${METRICS_TOKEN}
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          environment: 'dev'
