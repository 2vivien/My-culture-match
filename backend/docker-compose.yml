# ─────────────────────────────────────────────────────────────
# My Culture Match — Stack de développement local
# Usage : docker compose up -d
# Services : PostgreSQL 16, Redis 7, Meilisearch, MinIO, Mailpit
# ─────────────────────────────────────────────────────────────
name: mcm-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcm
      POSTGRES_PASSWORD: mcm_secret
      POSTGRES_DB: mcm
    ports:
      - "5432:5432"
    volumes:
      - mcm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcm -d mcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mcm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mcm_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mcm_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - mcm_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mcm_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mcm_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mcm_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mcm_pg_data:
  mcm_redis_data:
  mcm_meili_data:
  mcm_minio_data:
