# ─────────────────────────────────────────────────────────────
# Observabilité locale — My Culture Match (MP18)
# Démarre Prometheus + Grafana en plus du docker-compose principal.
#
#   docker compose -f docker-compose.observability.yml up -d
#   → Prometheus : http://localhost:9090
#   → Grafana    : http://localhost:3001  (admin / admin)
#
# Le dashboard Grafana est provisionné automatiquement depuis
# grafana/dashboards/mcm-backend.json.
# ─────────────────────────────────────────────────────────────
name: mcm-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mcm_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - mcm_prom_data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.2.2
    container_name: mcm_grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mcm_grafana_data:/var/lib/grafana

volumes:
  mcm_prom_data:
  mcm_grafana_data:
