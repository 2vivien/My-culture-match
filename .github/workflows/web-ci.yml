name: CI — My Culture Match Web

on:
  push:
    branches: [main, develop]
    paths:
      - 'myculturematch-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'myculturematch-web/**'
      - '.github/workflows/web-ci.yml'

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck + Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myculturematch-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myculturematch-web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_MAP_TILES_URL: https://tiles.example.invalid/{z}/{x}/{y}.png
