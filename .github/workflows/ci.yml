name: CI — My Culture Match Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 3000
  DATABASE_URL: postgresql://mcm:mcm_secret@localhost:5432/mcm?sslmode=disable
  DATABASE_POOL_SIZE: 5
  REDIS_URL: redis://localhost:6379
  REDIS_POOL_SIZE: 5
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32chars
  BETTER_AUTH_URL: http://localhost:3000
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  MINIO_ENDPOINT: localhost
  MINIO_PORT: 9000
  MINIO_USE_SSL: 'false'
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET_NAME: mcm-media
  MEILISEARCH_HOST: http://localhost:7700
  MEILISEARCH_API_KEY: masterKey
  LOG_LEVEL: silent

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck-and-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  unit-tests:
    name: Tests unitaires (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    name: Tests d'intégration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcm
          POSTGRES_PASSWORD: mcm_secret
          POSTGRES_DB: mcm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcm -d mcm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports: ['7700:7700']
        env:
          MEILI_MASTER_KEY: masterKey
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio:latest
        ports: ['9000:9000']
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migrations DB (dry-run + apply)
        run: |
          npm run migrate:generate -- --name ci-check
          npm run migrate
        env:
          DATABASE_URL: postgresql://mcm:mcm_secret@localhost:5432/mcm?sslmode=disable
      - run: npm run test:integration

  coverage:
    name: Couverture (unit + intégration)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcm
          POSTGRES_PASSWORD: mcm_secret
          POSTGRES_DB: mcm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcm -d mcm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports: ['7700:7700']
        env:
          MEILI_MASTER_KEY: masterKey
      minio:
        image: minio/minio:latest
        ports: ['9000:9000']
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - name: Vitest avec couverture (seuil 80% sur stmts)
        run: npx vitest run --coverage --coverage.thresholds.statements 80
