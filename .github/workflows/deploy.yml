name: Deploy — My Culture Match Backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/backend

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.sha-tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose image tag (sha)
        id: sha-tag
        run: echo "image=${{ env.IMAGE }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (image + stack)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral smoke-test secrets
        run: |
          {
            echo "SMOKE_PG_PASSWORD=$(openssl rand -hex 16)"
            echo "SMOKE_MEILI_KEY=$(openssl rand -hex 32)"
            echo "SMOKE_MINIO_ACCESS_KEY=$(openssl rand -hex 12)"
            echo "SMOKE_MINIO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "SMOKE_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "SMOKE_METRICS_TOKEN=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Start services internes (prod compose)
        working-directory: backend
        run: |
          POSTGRES_PASSWORD="$SMOKE_PG_PASSWORD" \
          MEILISEARCH_API_KEY="$SMOKE_MEILI_KEY" \
          MINIO_ACCESS_KEY="$SMOKE_MINIO_ACCESS_KEY" \
          MINIO_SECRET_KEY="$SMOKE_MINIO_SECRET_KEY" \
          docker compose -f docker-compose.prod.yml up -d --wait postgres redis meilisearch minio mailpit

      - name: Run API (image poussée)
        run: |
          docker run -d --rm --name mcm-smoke-api \
            --network mcm-backend-prod_default \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL="postgresql://mcm:${SMOKE_PG_PASSWORD}@postgres:5432/mcm?sslmode=disable" \
            -e REDIS_URL='redis://redis:6379' \
            -e BETTER_AUTH_SECRET="$SMOKE_AUTH_SECRET" \
            -e BETTER_AUTH_URL='http://localhost:3000' \
            -e MEILISEARCH_HOST='http://meilisearch:7700' \
            -e MEILISEARCH_API_KEY="$SMOKE_MEILI_KEY" \
            -e MINIO_ENDPOINT='minio' \
            -e MINIO_PORT='9000' \
            -e MINIO_ACCESS_KEY="$SMOKE_MINIO_ACCESS_KEY" \
            -e MINIO_SECRET_KEY="$SMOKE_MINIO_SECRET_KEY" \
            -e MINIO_BUCKET_NAME='mcm-media' \
            -e SMTP_HOST='mailpit' \
            -e SMTP_PORT='1025' \
            -e LOG_LEVEL='info' \
            -e METRICS_TOKEN="$SMOKE_METRICS_TOKEN" \
            -p 3000:3000 \
            ${{ needs.build-and-push.outputs.image }}

      - name: Smoke test
        working-directory: backend
        run: BASE_URL=http://localhost:3000 SMOKE_METRICS_TOKEN="$SMOKE_METRICS_TOKEN" ./scripts/smoke.sh

      - name: Cleanup
        if: always()
        run: |
          docker rm -f mcm-smoke-api || true
          docker compose -f backend/docker-compose.prod.yml down -v

  deploy:
    name: Deploy ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke]
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: ./scripts/deploy.sh
        working-directory: backend
